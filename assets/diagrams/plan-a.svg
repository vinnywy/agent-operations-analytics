<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="t d"><title id="t">Plan A local-first architecture</title><desc id="d">Official repository distributes protocol to local agent and harness. Personal SQLite stays outside the workspace.</desc><style>text{font-family:Arial,sans-serif;fill:#132238}.box{fill:#eef5ff;stroke:#2463a5;stroke-width:2}.local{fill:#effaf3;stroke:#2b7a4b;stroke-width:2}.arr{stroke:#46596f;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#46596f"/></marker></defs><rect x="50" y="45" width="220" height="85" rx="10" class="box"/><text x="75" y="80" font-size="20">Official repository</text><text x="75" y="108" font-size="14">policy · skills · schemas</text><rect x="390" y="45" width="220" height="85" rx="10" class="local"/><text x="420" y="80" font-size="20">Agent client</text><text x="420" y="108" font-size="14">selected context and skill</text><rect x="740" y="45" width="230" height="85" rx="10" class="local"/><text x="778" y="80" font-size="20">Harness</text><text x="765" y="108" font-size="14">states · hashes · checks</text><rect x="390" y="210" width="220" height="80" rx="10" class="local"/><text x="410" y="245" font-size="18">Workspace</text><text x="410" y="269" font-size="14">code and analytics artifacts</text><rect x="740" y="210" width="230" height="80" rx="10" class="local"/><text x="758" y="245" font-size="18">Personal SQLite</text><text x="758" y="269" font-size="14">profile · task state · reports</text><path d="M270 88H390M610 88H740M500 130V210M855 130V210" class="arr"/></svg>
