name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: git archive --format=zip --output=snapshot.zip HEAD
      - run: python -c "import zipfile; zipfile.ZipFile('snapshot.zip').extractall('snapshot')"
      - run: python snapshot/scripts/validate_public_snapshot.py
  memory-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s experiments/shared-memory/tests -v
